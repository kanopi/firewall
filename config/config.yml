# Global settings. Left empty here so a caller's own YAML supplies them.
#   require_config: when true, Firewall::create() throws
#                   ConfigurationException if any config input failed to
#                   load, instead of starting with a partial ruleset. The
#                   default (false) logs each failure at `error` and starts
#                   anyway. Define KANOPI_FIREWALL_REQUIRE_CONFIG for the
#                   case where the file carrying this flag is the one that
#                   failed to load.
global: ~
storage: ~
plugins: []
# Settings for the `response: challenge` flow. Defaults below apply when
# at least one plugin uses `response: challenge`; if no challenge plugins
# are configured this section is ignored.
#   secret:      HMAC key for signing pass tokens. REQUIRED when challenge
#                plugins are active. Use a long random string, typically
#                injected from an env var (`%env(VAR)%`). Unrelated to any
#                third-party challenge service's secret key.
#   provider:    Built-in short name (`math`, `altcha`, `turnstile`,
#                `recaptcha`) or a
#                FQCN that implements
#                Kanopi\Firewall\Challenge\ChallengeProviderInterface.
#                This is the default; an individual plugin can name its own
#                with `metadata.challenge_provider`, so a broad heuristic can
#                serve a cheap math question while a login brute-force rule
#                serves reCAPTCHA. Pass tokens are scoped to the provider
#                that issued them, so a client tripping two rules with
#                different providers solves both challenges.
#   path:        URL the interstitial form POSTs to.
#   cookie_name: Cookie that carries the pass token after a successful
#                challenge. Set to "" to disable the cookie delivery path.
#   header_name: Header the interstitial JS stashes in localStorage and
#                that SPA callers send on subsequent XHRs. Set to "" to
#                disable the localStorage delivery path.
#   provider_options:
#                Optional per-provider settings forwarded to the provider
#                constructor. `altcha` accepts `widget_src` and
#                `widget_integrity`; `turnstile` and `recaptcha` REQUIRE
#                `site_key` and `secret_key`, and `recaptcha` also takes
#                `version` (v2 or v3). See example/config.notes.yml.
#                Written flat, these belong to `provider` above. Once a
#                plugin names a different provider, give that one its own
#                block keyed by name -- a plugin-named provider is never
#                handed the flat block, so it cannot inherit another
#                service's keys:
#                  provider_options:
#                    recaptcha:
#                      site_key: '...'
#                      secret_key: '...'
#   audience:    Scopes pass tokens to this instance so two firewalls
#                sharing a secret do not accept each other's tokens.
#                Defaults to the `provider` value above when left empty --
#                so instances running the SAME provider (including
#                `recaptcha` at v2 and v3) must set this explicitly.
challenge:
  provider: math
  secret: ''
  path: /_firewall/challenge
  cookie_name: fw_challenge_pass
  header_name: X-Firewall-Challenge
  provider_options: {}
  audience: ''
# Legacy format (deprecated, auto-converted to plugins:)
bypass: ~
block: ~
logger: ~
