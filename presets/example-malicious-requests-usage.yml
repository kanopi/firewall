#           "15169": 0   # Google
#           "16509": 0   # Amazon AWS
#           "8075": 0    # Microsoft Azure
#
#           # Known problematic networks
#           "4134": 20   # Chinanet
#           "45102": 15  # Alibaba Cloud
#
#         asn_patterns:
#           vpn: 20
#           proxy: 20
#           hosting: 5

# Optional: Add allow rules for trusted IPs or specific paths
# plugins:
#   # Allow internal/trusted IPs
