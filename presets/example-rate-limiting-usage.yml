# Rate Limiting Usage Examples
#
# This file shows various ways to use and customize the rate-limiting.yml preset
# for different deployment scenarios and requirements.

# =============================================================================
# EXAMPLE 1: Basic Usage with Redis (Recommended)
# =============================================================================
# For production environments with Redis available
configs:
  - presets/rate-limiting.yml

# Override to use your Redis configuration
plugins:
  - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
    response: block
    metadata:
      storage:
        type: Kanopi\Firewall\RateLimitStorage\RedisRateLimitStorage
        config:
          redis:
            host: redis  # Or your Redis host
            port: 6379
            # Optional: Redis password
            # auth: "your-redis-password"

# =============================================================================
# EXAMPLE 2: Using Database Storage
# =============================================================================
# For environments without Redis, using existing database
# configs:
#   - presets/rate-limiting.yml
#
# plugins:
#   - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
#     response: block
#     metadata:
#       storage:
#         type: Kanopi\Firewall\RateLimitStorage\DatabaseRateLimitStorage
#         config:
#           storage-table: firewall_ratelimit
#           connection:
#             dbname: myapp
#             user: firewall_user
#             password: secure_password
#             host: localhost
#             port: 3306
#             driver: pdo_mysql

# =============================================================================
# EXAMPLE 3: Customizing Specific Endpoints
# =============================================================================
# Override specific rate limits while keeping preset defaults
# configs:
#   - presets/rate-limiting.yml
#
# plugins:
#   - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
#     response: block
#     config:
#       # More strict API limits
#       - path: /api/*
#         rate: 50      # 50 instead of default 100
#         sample: 60
#
#       # Allow more login attempts for internal network
#       # (Use with IP allow rules)
#       - path: /login
#         rate: 20      # 20 instead of default 10
#         sample: 300

# =============================================================================
# EXAMPLE 4: Development Environment (Relaxed Limits)
# =============================================================================
# Disable rate limiting or use very high limits for development
# configs:
#   - presets/rate-limiting.yml
#
# plugins:
#   - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
#     response: block
#     enable: false  # Completely disable in dev
#
# OR use very high limits:
# plugins:
#   - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
#     response: block
#     metadata:
#       default_rate: 10000
#       default_sample: 60

