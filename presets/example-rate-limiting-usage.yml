# =============================================================================
# Optimize for WordPress-specific traffic patterns
# configs:
#   - presets/rate-limiting.yml
#   - presets/wordpress.yml  # Combine with WordPress preset
#
# plugins:
#   - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
#     response: block
#     metadata:
#       default_rate: 100
#       default_sample: 60
#       storage:
#         type: Kanopi\Firewall\RateLimitStorage\RedisRateLimitStorage
#         config:
#           redis:
#             host: redis
#             port: 6379
#     config:
#       # Very strict on login
#       - path: /wp-login.php
#         rate: 3
#         sample: 600  # 3 attempts per 10 minutes
#
#       # Block XML-RPC completely (or rate limit severely)
