# =============================================================================
# EXAMPLE 9: Allow Rate Limits for Trusted IPs
# =============================================================================
# Combine rate limiting with IP allow rules
configs:
  - presets/rate-limiting.yml

plugins:
  # Allow ALL checks for trusted IPs (including rate limits)
  - plugin: "Kanopi\\Firewall\\Plugins\\IpAddress"
    response: allow
    weight: -200  # Execute before rate limiting
    enable: true
    config:
      - 192.168.1.0/24  # Internal network
      - 10.0.0.0/8      # Office network
      - 203.0.113.50    # Monitoring server

# =============================================================================
# EXAMPLE 10: File Storage (Simple Deployment)
# =============================================================================
# For single-server deployments without Redis
# configs:
#   - presets/rate-limiting.yml
#
# plugins:
#   - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
#     response: block
#     metadata:
#       storage:
#         type: Kanopi\Firewall\RateLimitStorage\FileRateLimitStorage
#         config:
#           file: /var/lib/firewall/ratelimit.data
#
# IMPORTANT: Ensure the file location is:
# - Writable by the web server user
# - Outside the web root for security
# - On fast storage (SSD recommended)
# - Regularly cleaned up (old entries)
