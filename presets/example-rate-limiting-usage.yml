#         sample: 86400  # Per day
#
#       # Pro tier
#       - path: /api/pro/*
#         rate: 1000
#         sample: 86400  # Per day
#
#       # Enterprise tier
#       - path: /api/enterprise/*
#         rate: 10000
#         sample: 86400  # Per day

# =============================================================================
