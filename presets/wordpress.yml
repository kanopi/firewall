# WordPress Endpoint Blocking Configuration
#
# Preset-Version: 2 — see CHANGELOG.md in this directory for what has
# changed about what this blocks, separately from the library version.
#
# Blocks common WordPress admin pages, sensitive files, and attack vectors
# while allowing normal website functionality.
#
# REQUIRES `global.path_source: script_name`. WordPress serves wp-login.php,
# xmlrpc.php, wp-cron.php and every /wp-admin/*.php as files of their own,
# and under the default path source each of them is matched as "/" -- so the
# rules below would never fire on the pages they name (#414).
#
# WHERE WORDPRESS LIVES DOES NOT MATTER (#420). The rules match WordPress's
# files and directories at any depth, on a segment boundary, so one preset
# covers every layout:
#
#   /wp-login.php            WordPress at the root
#   /blog/wp-login.php       installed in a subdirectory
#   /wp/wp-login.php         core in its own directory ("Giving WordPress Its
#                            Own Directory"), with index.php at the root
#   /blog/wp/wp-login.php    both
#
# Core in its own directory needs no base_path. A SUBDIRECTORY install
# (/blog) still sets `base_path: /blog`: that is how script_name tells the
# front controller, /blog/index.php, from a file served directly, and without
# it routed requests such as /blog/wp-json/... are seen as /blog/index.php.
# "On a segment boundary" means /2026/wp-admin-tips/ is a post, not the admin.
#
# Patterns are regexes matched case-insensitively (the firewall lower-cases
# the path and the pattern), so they are written in lower case with no
# escape whose meaning changes with case.

plugins:
  - plugin: "Kanopi\\Firewall\\Plugins\\Url"
    response: block
    weight: -100
    enable: true
    config:
      # =====================================================================
      # WordPress Admin Access
      # Block all wp-admin and wp-login access, wherever core is installed
      # =====================================================================
      - path@regex:#(^|/)wp-admin(/|$|\.)#
      - path@regex:#(^|/)wp-login(/|$|\.)#

      # =====================================================================
      # XML-RPC Endpoint
      # Frequently abused for DDoS and brute force attacks
      # =====================================================================
      - path@regex:#(^|/)xmlrpc\.php$#

      # =====================================================================
      # WordPress REST API
      # Block all REST API access (uncomment if you need to block it)
      # =====================================================================
      - path@regex:#(^|/)wp-json(/|$)#

      # =====================================================================
      # WordPress Configuration Files
      # Prevent direct access to sensitive configuration files
      # =====================================================================
      - path@contains:/wp-config
      - path@regex:#(^|/)(readme\.html|license\.txt)$#

      # =====================================================================
      # WordPress Core PHP Files
      # Block direct access to WordPress core files
      # =====================================================================
      - path@regex:#(^|/)wp-(activate|blog-header|comments-post|cron|links-opml|load|mail|settings|signup|trackback)\.php$#

      # =====================================================================
      # WordPress Includes Directory
      # Block direct access to wp-includes PHP files
      # =====================================================================
      - type: AND
        rules:
          - path@contains:/wp-includes/
          - path@ends_with:.php

      # =====================================================================
      # Uploaded File PHP Execution
      # Prevent PHP execution in uploads directory
      # =====================================================================
      - type: AND
        rules:
          - path@contains:/wp-content/uploads/
          - path@ends_with:.php

      # =====================================================================
      # Debug and Error Logs
      # Prevent access to log files
      # =====================================================================
      - path@ends_with:/debug.log
      - path@ends_with:/error_log
      - path@contains:/error_log

      # =====================================================================
      # Common Attack Patterns in URLs
      # Block obvious malicious patterns
      # =====================================================================
      - path@contains:../
      - path@contains:..%2F
      - path@contains:.env
      - path@contains:/phpMyAdmin
      - path@contains:/phpmyadmin

      # =====================================================================
      # SQL Injection and Code Execution in Query Strings
      # Block common attack patterns in URL parameters
      # =====================================================================
      - query@contains:UNION
      - query@contains:SELECT
      - query@contains:base64_decode
      - query@contains:eval(
      - query@contains:system(
      - query@contains:exec(
      - query@contains:shell_exec

      # =====================================================================
      # WordPress Vulnerability Scanners
      # Block known WordPress vulnerability scanners by User-Agent
      # =====================================================================
      - header.user-agent@contains:WPScan
      - header.user-agent@regex:/wp[_-]?(scan|vuln|exploit)/i

# =====================================================================
# Optional: Bypass Rules
# =====================================================================
# Uncomment and configure if you need to allow specific IPs to access
# WordPress admin or other blocked endpoints
#
# plugins:
#   - plugin: "Kanopi\\Firewall\\Plugins\\IpAddress"
#     response: allow
#     weight: -200
#     enable: true
#     config:
#       # Allow office IP
#       - 192.168.1.100/32
#       # Allow VPN subnet
#       - 10.0.0.0/8
