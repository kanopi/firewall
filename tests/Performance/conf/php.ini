; Production-shaped PHP settings for the performance harness.
;
; The goal is to measure what the firewall costs a real deployment, so
; opcache is on and tuned as it would be in production. Benchmarking with
; opcache off would inflate every scenario equally and tell you nothing
; useful about relative plugin cost.

memory_limit = 256M
max_execution_time = 30
expose_php = Off

; Logging to stderr keeps php-fpm's output in `docker compose logs` rather
; than in a file nobody reads. display_errors stays off so a warning can
; never end up concatenated into a response body and skew a byte count.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Every request routes through app/prepend.php, which rewrites REMOTE_ADDR
; from a header so a single load generator can present thousands of
; distinct client IPs to the firewall. It is inert unless FIREWALL_PERF=1.
auto_prepend_file = /app/tests/Performance/app/prepend.php
