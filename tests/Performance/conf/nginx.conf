# nginx front end for the performance harness.
#
# Tuned so that nginx is never the constraint: the numbers this harness
# produces should describe PHP and the firewall, not a starved event loop
# or an undersized upstream connection pool.

worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  8192;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access logging is off by default: at a few thousand RPS the write
    # syscalls are measurable, and they are the same overhead for every
    # scenario, so all they do is add noise to the comparison. Turn it on
    # only when you are debugging what the generator actually sent.
    access_log  off;
    error_log   /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  75;
    keepalive_requests 100000;

    upstream php-fpm {
        server php:9000;
        # Persistent upstream connections. Without these, every request
        # pays a TCP handshake to php-fpm, which at high concurrency
        # dwarfs the firewall's own cost and hides what we came to see.
        keepalive 128;
    }

    server {
        listen 80 default_server backlog=4096;
        server_name _;
        root /app/tests/Performance/app;

        # Single front controller. Static files are not part of the test —
        # every request must reach PHP for the firewall to evaluate it.
        location / {
            fastcgi_pass  php-fpm;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/tests/Performance/app/index.php;
            fastcgi_param DOCUMENT_ROOT   /app/tests/Performance/app;

            fastcgi_buffer_size       32k;
            fastcgi_buffers           16 32k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_read_timeout      60;

            # Required for the upstream keepalive above to take effect.
            fastcgi_keep_conn on;
        }
    }
}
