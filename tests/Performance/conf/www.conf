; PHP-FPM pool for the performance harness.
;
; pm = static is deliberate. Dynamic pools spawn and reap workers during a
; benchmark, and that churn shows up as latency variance that has nothing
; to do with the firewall. A fixed worker count makes each scenario's run
; comparable to every other scenario's run, which is the entire point.
;
; __PERF_FPM_WORKERS__ is replaced by conf/entrypoint.sh at container start
; from the PERF_FPM_WORKERS environment variable.
[www]
user = www-data
group = www-data
listen = 9000
listen.backlog = 4096

pm = static
pm.max_children = __PERF_FPM_WORKERS__

; Never recycle a worker mid-run. Recycling re-pays the autoloader and
; config-parse cost on the next request, which would land as a latency
; outlier attributed to whichever plugin happened to be under test.
pm.max_requests = 0

pm.status_path = /fpm-status

catch_workers_output = yes
decorate_workers_output = no

; Hand the container's whole environment to workers. The harness selects
; its scenario through FIREWALL_PERF_SCENARIO, so the app needs to see it;
; enumerating each variable with env[] would mean editing this file every
; time a scenario grows a new setting.
clear_env = no
