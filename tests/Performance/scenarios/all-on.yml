# Scenario: all-on
#
# Everything enabled at once, ordered the way the plugin docs recommend:
# cheap static checks first, mmdb lookups next, then the expensive analysers.
#
# The total here should be noticeably LESS than the sum of the individual
# scenarios, because early plugins short-circuit the chain — a request blocked
# by the IP list never reaches CRS. If it is not less, the ordering is not
# doing its job and that is a finding worth acting on.
#
# Storage stays in-memory so this is comparable with the per-plugin scenarios;
# all-on-redis is the same config with real shared storage behind it.
configs:
  - "{presets_dir}/wordpress.yml"
  - "{presets_dir}/malicious-urls.yml"

global:
  mode: exception
  banning_message: "blocked"

storage:
  type: Kanopi\Firewall\Storage\InMemoryStorage

plugins:
  - plugin: "Kanopi\\Firewall\\Plugins\\IpAddress"
    response: block
    weight: -100
    enable: true
    config:
      - 203.0.113.0/24
      - 198.51.100.0/24
      - 185.220.100.0/22
      - 89.248.165.0/24
      - 162.142.125.0/24
      - 167.94.138.0/24
      - 205.210.31.0/24
      - 218.92.0.0/16
      - 222.186.0.0/16

  - plugin: "Kanopi\\Firewall\\Plugins\\GeoLocation"
    response: block
    weight: -80
    enable: true
    metadata:
      reader:
        type: reader
        db: /geoip/GeoLite2-City.mmdb
    config:
      - "country:CN"
      - "country:RU"
      - "country:KP"
      - "country:IR"

  - plugin: "Kanopi\\Firewall\\Plugins\\Asn"
    response: block
    weight: -70
    enable: true
    metadata:
      reader:
        type: reader
        db: /geoip/GeoLite2-ASN.mmdb
    config:
      - "asn:14061"
      - "asn:16276"
      - "asn:24940"
      - "asn:9009"

  - plugin: "Kanopi\\Firewall\\Plugins\\UserAgent"
    response: block
    weight: -30
    enable: true
    config:
      - "bot:true"
      - "client.name@contains:sqlmap"
      - "client.name@contains:nikto"
      - "client.name@contains:masscan"
      - "client.name@contains:nmap"
      - "client.name@contains:zgrab"

  - plugin: "Kanopi\\Firewall\\Plugins\\AbuseIpdb"
    response: block
    weight: 40
    enable: true
    config:
      api_key: "perf-harness-placeholder-key-never-sent"
      threshold: 75
      cache_ttl: 86400
      error_cache_ttl: 300
      timeout: 0.5
      max_age_in_days: 30
      cache_dir: /perf-cache/abuseipdb
      block_status: 403
      block_duration: 3600

  - plugin: "Kanopi\\Firewall\\Plugins\\Crs"
    response: block
    weight: 50
    enable: true
    config:
      paranoia: 1
      mode: block
      block_status: 403
      block_duration: 3600
      anomaly_thresholds:
        inbound: 5
        outbound: 4

  - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
    response: block
    weight: 100
    enable: true
    metadata:
      default_rate: 60
      default_sample: 60
      default_expiration_time: 300
      storage:
        type: Kanopi\Firewall\RateLimitStorage\InMemoryRateLimitStorage
    config:
      - path: /login
        rate: 5
        sample: 60
      - path: /api/*
        rate: 100
        sample: 60
      - path: /admin/*
        rate: 20
        sample: 60
