# Scenario: ip-address
#
# The cheapest plugin, and the one most deployments run first. The rule list
# is deliberately large (a few hundred CIDRs) because a five-entry blocklist
# would benchmark as free and tell you nothing about how the plugin scales
# with the list size people actually deploy.
#
# The 203.0.113.0/24 and 198.51.100.0/24 blocks are TEST-NET ranges from the
# k6 IP pool, so a measurable slice of generated traffic matches.
global:
  mode: exception
  banning_message: "blocked"

storage:
  type: Kanopi\Firewall\Storage\InMemoryStorage

plugins:
  - plugin: "Kanopi\\Firewall\\Plugins\\IpAddress"
    response: block
    weight: -100
    enable: true
    config:
      # Ranges the generator actually sends from.
      - 203.0.113.0/24
      - 198.51.100.0/24
      # Bulk filler so the matcher walks a realistic list before deciding.
      - 5.188.10.0/24
      - 45.129.14.0/24
      - 45.155.205.0/24
