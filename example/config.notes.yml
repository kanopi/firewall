# Configuration file in yaml format
# Information provided here is where the blocked IP addresses are stored.
storage:
  # In Memory (Doesn't Save and Resets on every Request)
  type: Kanopi\Firewall\Storage\InMemoryStorage

  # File Storage (writes to the file system)
  type: Kanopi\Firewall\Storage\FileStorage
  config:
    # File where to store the data.
    file: /tmp/firewall.data

  # Uses a Database to store configuration
  type: Kanopi\Firewall\Storage\DatabaseStorage
  config:
    # Table that is created in the system to store data
    storage-table: firewall-storage

    # Connection details
    connection:
      # connection using a url (follows https://www.doctrine-project.org/projects/doctrine-dbal/en/4.2/reference/configuration.html#connecting-using-a-url)
      dsn: "pdo-mysql://user:user@127.0.0.1:33066/default?serverVersion=10.6"

    # Connection details (follow https://www.doctrine-project.org/projects/doctrine-dbal/en/4.2/reference/configuration.html#connection-details)
    # connection:
    #   dbname: 'default'
    #   user: 'user'
    #   password: 'user'
    #   host: '127.0.0.1'
    #   port: 33066
    #   driver: 'pdo_mysql'

# Challenge configuration
#
# Settings that govern the `response: challenge` interstitial flow. This whole
# section is ignored when no plugin uses `response: challenge`. When any
# plugin does, `secret` is REQUIRED — startup throws ConfigurationException
# if it is empty.
challenge:
  # Short name of a built-in provider ("math", "altcha", "turnstile",
  # "recaptcha") or FQCN of a class implementing
  # Kanopi\Firewall\Challenge\ChallengeProviderInterface.
  #   math      — "What is A + B?" with single-digit operands. Low-friction
  #               proof-of-effort, no JS bundle, no external script load.
  #   altcha    — Embeds the ALTCHA v2 widget with a pre-computed challenge.
  #               The browser brute-forces SHA-256(salt + N) == challenge;
  #               challenge is HMAC-signed with `secret`. Privacy-respecting,
  #               per-solve CPU cost on bots, solved challenges are
  #               single-use. See https://altcha.org/docs/v2/.
  #   turnstile — Embeds the Cloudflare Turnstile widget and verifies its
  #               token against Cloudflare's siteverify API. Strongest bot
  #               resistance, and the only provider that needs a third party
  #               reachable from BOTH the browser and this server. Requires
  #               provider_options.site_key and .secret_key. Replay is
  #               handled by Cloudflare, so no storage is involved.
  #               See https://developers.cloudflare.com/turnstile/.
  #   recaptcha — Embeds a Google reCAPTCHA widget and verifies its token
  #               against Google's siteverify API. Same shape as turnstile,
  #               and the same third-party dependency in both directions.
  #               Offers two versions: v2 (the "I'm not a robot" checkbox,
  #               the default) and v3 (invisible, returns a 0.0-1.0 score
  #               this provider compares against min_score). Requires
  #               provider_options.site_key and .secret_key. Replay is
  #               handled by Google, so no storage is involved.
  #               See https://developers.google.com/recaptcha/.
  #
  # This is the DEFAULT. An individual plugin can name its own provider with
  # `metadata.challenge_provider`, so a broad, low-confidence heuristic can
  # serve a cheap math question while a brute-force rule on a login path
  # serves reCAPTCHA -- instead of every rule paying for the strictest one.
  # Pass tokens are scoped to the provider that issued them, so a client
  # tripping two rules with different providers solves both challenges.
  # Every provider named by a plugin is built at STARTUP, so a typo or a
  # missing key pair throws here rather than on the first visitor to trip
  # that rule.
  provider: math
  # Optional per-provider settings, forwarded to the provider constructor.
  # Unknown keys are ignored, so this is safe to leave empty.
  #
  # Written flat, as documented below, these belong to `provider` above.
  # Once a plugin names a DIFFERENT provider, give that one its own block
  # keyed by provider name:
  #
  #   provider_options:
  #     turnstile:
  #       site_key: '%env(TURNSTILE_SITE_KEY)%'
  #       secret_key: '%env(TURNSTILE_SECRET_KEY)%'
  #     altcha:
  #       widget_src: /assets/altcha.min.js
  #
  # A named block always wins. The flat block is handed to `provider` ONLY
  # -- a plugin-named provider gets nothing rather than another service's
  # keys, since Turnstile's secret_key reaching reCAPTCHA would look
  # configured right up until Google rejected every solution.
  #
  # altcha accepts:
  #   widget_src       — URL of the ALTCHA widget bundle. Defaults to an
  #                      exact pinned version on jsDelivr. Override to
  #                      self-host, or to use a host your CSP allows.
  #   widget_integrity — SRI digest matching widget_src. Defaults to the
  #                      digest of the pinned bundle. If you set widget_src
  #                      without this, no integrity attribute is emitted —
  #                      a mismatched digest would block the script.
  #                      Generate with:
  #                        openssl dgst -sha384 -binary FILE | openssl base64 -A
  #
  # turnstile accepts:
  #   site_key         — REQUIRED. Turnstile site key. PUBLIC: it is rendered
  #                      into the interstitial.
  #   secret_key       — REQUIRED. Turnstile secret key. PRIVATE: only ever
  #                      sent server-to-server to siteverify. Note this is
  #                      NOT the same thing as `challenge.secret` below.
  #                      Omitting either key throws at startup rather than
  #                      serving a widget nobody could pass.
  #   theme            — Widget colour scheme: auto (default), light, dark.
  #   timeout          — Seconds to wait for siteverify. Clamped to 1-10,
  #                      default 2. This runs while the visitor waits.
  #   on_error         — What to do when siteverify cannot be REACHED:
  #                      block (default) or allow. Blocking is the safe
  #                      default — a verdict you could not obtain is not a
  #                      pass, and failing open would make any siteverify
  #                      disruption a bypass for every challenged route. The
  #                      trade-off is that challenged routes are impassable
  #                      while Cloudflare is unreachable. This never applies
  #                      to a token Cloudflare actively rejected.
  #   send_remoteip    — Forward the visitor's IP to Cloudflare. Default
  #                      false, because getClientIp() is only trustworthy
  #                      when global.require_trusted_proxies is configured;
  #                      behind an unconfigured proxy a spoofed
  #                      X-Forwarded-For would send Cloudflare an unrelated
  #                      address and fail verification for real visitors.
  #   widget_src       — Override the widget bundle URL, e.g. to serve it via
  #                      a first-party proxy. No SRI digest is emitted for
  #                      any value: Cloudflare's URL is unversioned and
  #                      mutable, so a pinned digest would break on their
  #                      next deploy.
  #
  # recaptcha accepts:
  #   site_key          — REQUIRED. reCAPTCHA site key. PUBLIC: it is
  #                       rendered into the interstitial.
  #   secret_key        — REQUIRED. reCAPTCHA secret key. PRIVATE: only ever
  #                       sent server-to-server to siteverify. NOT the same
  #                       thing as `challenge.secret` below. Omitting either
  #                       key throws at startup rather than serving a widget
  #                       nobody could pass.
  #   version           — v2 (default) or v3. The key pair registered with
  #                       Google has to match: a v2 pair returns no score,
  #                       which v3 refuses rather than treating a well-formed
  #                       token as a trustworthy visitor.
  #                       Prefer v2. v3 never asks the visitor for anything,
  #                       so a human scoring below min_score has no puzzle to
  #                       solve and no retry that helps — they simply cannot
  #                       reach the route.
  #   theme             — v2 only. light (default) or dark. reCAPTCHA has no
  #                       `auto` value.
  #   size              — v2 only. normal (default) or compact.
  #   min_score         — v3 only. Lowest passing score, 0.0-1.0, default
  #                       0.5. Clamped into range. Pick it from observed
  #                       traffic, not from the 0.5 in Google's docs.
  #   action            — v3 only, default `firewall`. A security control,
  #                       not a label: a v3 token is minted by the site key
  #                       rather than by a page, so without binding it to an
  #                       action a token from any other reCAPTCHA call on the
  #                       site would satisfy this challenge too.
  #   timeout           — Seconds to wait for siteverify. Clamped to 1-10,
  #                       default 2. This runs while the visitor waits.
  #   on_error          — What to do when siteverify cannot be REACHED:
  #                       block (default) or allow. Same trade-off, and the
  #                       same reasoning, as turnstile above.
  #   send_remoteip     — Forward the visitor's IP to Google. Default false,
  #                       for the same proxy-trust reason as turnstile above.
  #   use_recaptcha_net — Serve the widget from and verify against
  #                       www.recaptcha.net instead of www.google.com, for
  #                       networks where google.com is blocked. Moves both
  #                       halves together; a widget the visitor can load is
  #                       useless if this server cannot verify its output.
  #   widget_src        — Override the widget bundle URL, e.g. to serve it
  #                       via a first-party proxy. On v3 the `render`
  #                       parameter is appended unless the URL already
  #                       carries one. No SRI digest is emitted: api.js is
  #                       unversioned and bootstraps further scripts.
  #
  # NOTE for recaptcha: `audience` below defaults to this `provider` string,
  # which is `recaptcha` for BOTH versions. Two instances sharing a `secret`
  # but running v2 and v3 will therefore honour each other's pass tokens —
  # and a v3 pass is the weaker claim. Set `audience` explicitly on at least
  # one of them.
  provider_options: {}
  # Scopes pass tokens to this instance. Tokens carry the value as an `aud`
  # claim and only verify against a firewall configured with the same one,
  # so two instances that share `secret` but run different challenges do
  # not accept each other's tokens. Defaults to the provider name; set it
  # explicitly when several instances run the SAME provider and should not
  # share passes (e.g. a public site and an admin portal).
  audience: ''
  # HMAC secret used to sign pass tokens. MUST be a long, random value. The
  # `%env(VAR)%` syntax loads it from an env var so it stays out of source
  # control. Note `${VAR}` is NOT substituted — it would be taken literally,
  # giving every deployment that copied it the same known secret.
  secret: '%env(FIREWALL_CHALLENGE_SECRET)%'
  # URL the interstitial form POSTs to. Configurable so it can avoid colliding
  # with application routes.
  path: /_firewall/challenge
  # Cookie that carries the pass token (HttpOnly; Secure; SameSite=Strict).
  # Set to "" to disable the cookie delivery path.
  cookie_name: fw_challenge_pass
  # Custom request header that SPA callers can send with the same pass token
  # (read back from localStorage after a successful challenge). Set to "" to
  # disable the localStorage / header delivery path.
  header_name: X-Firewall-Challenge

# Plugins (canonical format)
#
# The plugins: array is the preferred way to declare firewall plugins. Each entry
# is an associative map describing one plugin instance. Common fields:
#   - plugin:   Fully qualified class name (double-quoted with escaped backslashes).
#   - response: 'allow'     - request bypasses the firewall when matched.
#               'block'     - request is rejected when matched.
#               'challenge' - visitor is shown a CAPTCHA-style interstitial; on
#                             success they get a signed pass token that
#                             short-circuits future challenge plugins for
#                             metadata.default_expiration_time seconds.
#   - weight:   Execution order. Lower runs first (e.g., -100 runs before 100).
#   - enable:   Whether the plugin is active.
#   - metadata: Plugin-specific options (readers, storage, defaults, etc.).
#   - config:   Rules or conditions consumed by the plugin.
#
# Evaluation order: `response: allow` runs first, then `response: challenge`
# (skipped if the visitor already holds a valid pass token), then `response: block`.
# Each bucket is sorted by weight independently.
#
# `response: challenge` also requires a top-level `challenge:` section. See the
# Challenge Configuration block below.
plugins:

  # ---------------------------------------------------------------------
  # response: allow
  # Plugins listed with `response: allow` let the request pass without further
  # questioning when they match. They are the canonical replacement for the
  # legacy top-level `bypass:` section.
  # ---------------------------------------------------------------------

  - plugin: "Kanopi\\Firewall\\Plugins\\IpAddress"
    # The request is allowed through (bypass) when this plugin matches.
    response: allow
    # Weight of the plugin. Executed in order from lowest to highest.
    # Example -100 is higher priority than 100.
    weight: 0
    # Enable the plugin.
    enable: false
    # Configuration for the plugin. This plugin takes a list of IP addresses in different formats.
    # Accepts both IPv4 and IPv6 address.
    config:
      # Single IPv4
      - 127.0.0.1
      # Single IPv6
      - ::1
      # CIDR Block
      - 10.0.0.1/24
      # IP Range formatted as start-end
      - 127.0.0.1-127.0.0.5

  # ---------------------------------------------------------------------
  # response: challenge
  # Plugins listed with `response: challenge` serve an interstitial when they
  # match. The visitor solves a CAPTCHA-style proof-of-effort (the built-in
  # provider asks "What is A + B?") and on success receives an HMAC-signed
  # pass token bound to their IP. Subsequent requests carrying that token
  # (via cookie or via a custom header populated from localStorage) skip
  # the challenge bucket until the token expires.
  #
  # `metadata.default_expiration_time` controls the pass-token TTL (seconds).
  # `metadata.challenge_provider` names the provider THIS rule serves,
  # overriding `challenge.provider` -- a built-in short name, or a FQCN
  # implementing ChallengeProviderInterface. Its options go under
  # `challenge.provider_options.<name>`. A pass earned here opens only the
  # rules that same provider serves.
  # Block plugins still apply — a pass token only attests "I am human", not
  # "I am allowed everywhere."
  #
  # Requires a top-level `challenge:` section (see further down in this file).
  # ---------------------------------------------------------------------

  - plugin: "Kanopi\\Firewall\\Plugins\\Asn"
    response: challenge
    weight: -10
    enable: false
    metadata:
      # Pass-token TTL after a successful challenge (seconds).
      default_expiration_time: 3600
      # Which provider serves this rule. Omit to use `challenge.provider`.
      # challenge_provider: recaptcha
    config:
      # Challenge traffic from cloud / hosting ASNs without outright blocking.
      - "asn:AS14618"
      - "asn:AS16509"

  # ---------------------------------------------------------------------
  # response: block
  # Plugins listed with `response: block` are evaluated and, if the request
  # passes their conditions, the request is blocked. This is the canonical
  # replacement for the legacy top-level `block:` section.
  # ---------------------------------------------------------------------

  # Evaluate IP Addresses.
  - plugin: "Kanopi\\Firewall\\Plugins\\IpAddress"
    response: block
    # Weight of the plugin. Executed in order from lowest to highest.
    # Example -100 is higher priority than 100.
    weight: 0
    # Enable the plugin.
    enable: false
    # Configuration for the plugin. This plugin takes a list of IP addresses in different formats.
    # Accepts both IPv4 and IPv6 address.
    config:
      # Single IPv4
      - 127.0.0.1
      # Single IPv6
      - ::1
      # CIDR Block
      - 10.0.0.1/24
      # IP Range formatted as start-end
      - 127.0.0.1-127.0.0.5

  # Using the MaxMind GeoIP service (either local database or service),
  - plugin: "Kanopi\\Firewall\\Plugins\\GeoLocation"
    response: block
    weight: 0
    enable: false
    # Information fed into the plugin.
    metadata:
      # IP Database reader details. More details on configuration https://maxmind.github.io/GeoIP2-php/.
      reader:
        # Create a reader or a client.
        # For type: reader  - uses the local MaxMind GeoIP database
        type: reader
        # File location of the database on the file system. (Example: /tmp/GeoLite2-City.mmdb)
        db: ~

        # For type: client  - uses the MaxMind Web Service.
        # type: client
        # accountId: ~        # Account ID for MaxMind Service
        # licenseKey: ~       # License Key for MaxMind Service
        # language: ['en']    # Languages that should be supported
        # options: []         # Additional Options that should be fed to the client.
    # Reference the Condition section
    # Possible variables:
    # country     - Refers to the country and returns the isoCode
    # country.X   - Refers to the country and the X is the part. Possible values are isoCode, name
    # continent   - Refers to the continent and returns the code
    # continent.X - Refers to the continent and the X is the part. Possible values are code, name, geonameId
    # city        - Refers to the city and returns the name
    # location.X  - Refers to the location and the X is the part. Possible values are latitude, longitude, timeZone
    # postal      - Refers to the postal code and returns the code.
    config: ~

  # URLs to check against for possible spam related activity.
  - plugin: "Kanopi\\Firewall\\Plugins\\Url"
    response: block
    weight: 0
    enable: false
    # Reference the Condition section
    # Possible variables:
    # method   - Method of the request (Like GET, POST, PUT)
    # host     - Hostname of the request
    # path     - Path of the request (Like /admin)
    # query.X  - The query parameter to check against. Example (query.foo will give you the value for the foo query parameter)
    # scheme   - The scheme of the request (Like https)
    # port     - Port number being requested
    # post.X   - The post value to check against. Example (post.foo will give you the value for the variable)
    # header.X - The header value for the request. Example (header.content-type will give you the content type)
    # cookie.X - The cookie value provided.
    config:
      # Block all POST requests
      - 'method:POST'
      # Block everything that doesn't start with /admin
      - '!path@starts_with:/admin'

  # Details related to the User Agent that is being used.
  # More information: https://devicedetector.lw1.at/
  - plugin: "Kanopi\\Firewall\\Plugins\\UserAgent"
    response: block
    weight: 0
    enable: false
    # Reference the Condition section
    # Possible variables:
    # bot             - Possible values are true or false
    # device.type     - Type of the device being used. (Like Desktop)
    # client.name     - Human Readable name of the client
    # client.type     - The type of client (Like browser)
    # client.version  - The version number of the client
    # os.name         - The OS name to reference (Like Windows)
    # os.short_name   - The short name for the OS (Like WIN)
    # os.version      - The OS Version Number
    # brand           - The brand of the device (Like Apple)
    # model           - Information related to the model of the user agent.
    config:
      - 'bot:true'

  # Use MaxMind's GeoIP database to get the ASN (Autonomous System Number).
  # More Information: https://www.arin.net/resources/guide/asn/
  - plugin: "Kanopi\\Firewall\\Plugins\\Asn"
    response: block
    weight: 0
    enable: false
    metadata:
      # Follows same information as the Kanopi\Firewall\Plugins\Geolocation Metadata
      reader:
        type: reader
        db: ~
    # Reference the Condition section
    # Possible variables:
    # asn     - the number to check against (Example: AS7018)
    # asn_org - the organization name to check against (Example: ATT-INTERNET4)
    config: ~

  # Rate Limiting suggests that we limit how often a request can be made.
  # The following is limited as it only takes into account the request as long as this file is located and processed.
  # This plugin won't take into account files, assets (css, js, images), or any possible other requests where this isn't
  # included as part of the bootstrapping process.
  - plugin: "Kanopi\\Firewall\\Plugins\\RateLimit"
    response: block
    weight: 0
    enable: false
    metadata:
      # Default amount of requests that can be made in the following
      default_rate: 10
      # Default sample size in seconds.
      default_sample: 10
      # Amount of time before the IP address is removed off of the request
      default_expiration_time: 300
      # Where the information is stored for counting and referencing later
      storage:

        # Store items In Memory (Good for testing, resets after each request).
        type: Kanopi\Firewall\RateLimitStorage\InMemoryRateLimitStorage

        # Store details within Redis Service
        type: Kanopi\Firewall\RateLimitStorage\RedisRateLimitStorage
        config:
          # Redis configuration settings.
          redis:
            # Host of the redis service
            host: 127.0.0.1
            # Port to use for connecting to redis service
            port: 6379
            # Types of Authentication
            # auth: "password"
            # auth: ["password"]
            # auth: ["username", "password"]
            auth: ['username', 'password']

        # Store details within a File
        type: Kanopi\Firewall\RateLimitStorage\FileRateLimitStorage
        config:
          # File location where to store the data.
          file: /tmp/test.data

        # Store details within a Database
        type: Kanopi\Firewall\RateLimitStorage\DatabaseRateLimitStorage
        config:
          # Table that is created in the system to store data
          storage-table: firewall-ratelimit-storage

          # Connection details
          connection:
            # connection using a url (More information https://www.doctrine-project.org/projects/doctrine-dbal/en/4.2/reference/configuration.html#connecting-using-a-url)
            dsn: "pdo-mysql://user:user@127.0.0.1:33066/default?serverVersion=10.6"

          # Connection details bro (More information https://www.doctrine-project.org/projects/doctrine-dbal/en/4.2/reference/configuration.html#connection-details)
          # connection:
          #   dbname: 'default'
          #   user: 'user'
          #   password: 'user'
          #   host: '127.0.0.1'
          #   port: 33066
          #   driver: 'pdo_mysql'

    # Items are added in structured format in array like syntax.
    # Each item should contain:
    #   path: Location to check against. Can be exact format like /example, can show a wildcard /example/*, or can be regex (/\/example.*/)
    #   rate: How many requests to this url in the sample size
    #   sample: Number of seconds to count against in the sample for this specific size
    config:
      # For the path / there can only be 1 request per 10 seconds.
      - path: '/'
        rate: 1
        sample: 10
      # For the example path use the default rate and sample
      - path: '/example'
      # For the foo path use the default rate but set the sample amount
      - path: '/foo'
        sample: 30
      # For all paths that begin with /admin use a different sample rate and size
      - path: '/admin/*'
        rate: 100
        sample: 60

  # OWASP Core Rule Set plugin. Evaluates each request against the parsed
  # CRS ruleset (SQLi, XSS, LFI, RCE, scanner detection, protocol
  # enforcement). Backed by the kanopi/crs-engine composer package, which
  # ships the parsed rules and refreshes them weekly from upstream.
  - plugin: "Kanopi\\Firewall\\Plugins\\Crs"
    response: block
    # Plugins are executed in weight order (lowest first). CRS is fairly
    # expensive (~3-4 ms per request once warm), so put it after the cheap
    # IP / UA / ASN filters but before any heavier downstream work.
    weight: 50
    enable: false
    config:
      # Paranoia level 1-4. 1 has the lowest false-positive rate; higher
      # levels enable progressively more aggressive rules.
      paranoia: 1
      # `block` reports a match once the anomaly score reaches the inbound
      # threshold, so the firewall applies this entry's `response:`.
      # `monitor` evaluates and records everything but never reports a
      # match. Start on monitor: crs-engine 1.0.0 rejects traffic that
      # earlier versions let through, so build an exclusion list from the
      # logged contributing_rules before letting it block.
      mode: block
      # HTTP status returned for blocked requests.
      block_status: 403
      # How long the firewall keeps the offending IP on its blocklist.
      block_duration: 3600
      # Override paths only if you've vendored a custom CRS build. Default
      # is vendor/kanopi/crs-engine/rules.
      # rules_path: /etc/firewall/crs-rules
      # Specific CRS rule IDs to skip. This — not the thresholds below — is
      # the lever for a known false positive: the blocked request's log line
      # carries the `rule_id` to add here.
      disabled_rules: []
      # Whole categories to skip. Values:
      # sqli, xss, lfi, rfi, rce, php, java, session_fixation,
      # protocol_attack, protocol_enforcement, method_enforcement, scanner,
      # multipart, generic, response_leak, response_leak_sql,
      # response_leak_java, response_leak_php, response_leak_iis,
      # response_leak_ruby, web_shell, correlation, blocking_evaluation.
      # Leave blocking_evaluation alone — disabling it stops anomaly
      # scoring rejecting anything at all.
      disabled_categories: []
      # Anomaly-score thresholds. There are exactly two, and only these two
      # keys are read — anything else (including the 'warning' and 'notice'
      # earlier versions of this file listed) is ignored and logged as such.
      # Per-severity score contributions are fixed by CRS, not set here.
      #
      # Matching rules accumulate a score; CRS rule 949110 rejects the
      # request once it reaches the inbound threshold. At the default of 5 a
      # single critical rule is enough. Raise it to require corroboration
      # from several rules; lower it to reject on weaker evidence.
      #
      # A block is attributed to 949110, not to the rule that caught the
      # payload. Never put 949110 in disabled_rules — it is how anomaly
      # blocking works. The IDs worth excluding are on the log line as
      # contributing_rules.
      anomaly_thresholds:
        # Request-side score at or above which the request is rejected.
        # Lower is stricter. The legacy spelling 'critical' still works.
        inbound: 5
        # Response-side equivalent. Not reached yet — this plugin does not
        # run response-side evaluation. The legacy spelling 'error' works.
        outbound: 4

  # AbuseIPDB reputation plugin. Scores the client IP 0-100 by how
  # confidently it has been reported for abuse, and matches once that score
  # reaches the threshold. Needs a free API key from
  # https://www.abuseipdb.com/account/api — with no api_key the plugin
  # matches nothing, so it is safe to leave configured but unkeyed.
  - plugin: "Kanopi\\Firewall\\Plugins\\AbuseIpdb"
    response: block
    # One cached lookup per visitor per day, so cheaper than CRS but dearer
    # than the static IP / UA / ASN filters. Sits between them.
    weight: 40
    enable: false
    config:
      # Required. Use an %env()% token rather than committing the key.
      api_key: "%env(ABUSEIPDB_API_KEY)%"
      # Abuse confidence (0-100) at or above which this plugin matches.
      # 75 is AbuseIPDB's own "strong enough to act on" mark. Going below
      # about 25 will turn away real users on recycled residential IPs.
      threshold: 75
      # How long a verdict is reused before asking again. The free tier
      # allows 1,000 checks a day, and clean results are cached too, so this
      # is what keeps a normal site inside the quota. Lower it only if you
      # have the quota to spare.
      cache_ttl: 86400
      # How long a *failed* lookup is remembered. Without this every request
      # during an outage would wait out the full timeout below before
      # failing open — availability on paper, a crawl in practice. Raise to
      # be more patient during an outage, lower to notice recovery sooner.
      error_cache_ttl: 300
      # Seconds to wait on the API before giving up. This sits in the
      # request path, so the ceiling on added latency matters more than
      # getting an answer.
      timeout: 2.0
      # How far back AbuseIPDB should consider reports.
      max_age_in_days: 30
      # Where verdicts are cached. Defaults to the system temp directory, or
      # KANOPI_FIREWALL_CACHE_DIR when that constant is defined. Entries are
      # named by hash, so client IPs are not readable from a listing.
      # cache_dir: /var/cache/firewall
      # HTTP status returned for blocked requests.
      block_status: 403
      # How long the firewall keeps the offending IP on its blocklist.
      block_duration: 3600
      #
      # Two behaviours with no config key, worth knowing:
      #
      # This plugin fails open. A timeout, a refused key or a spent quota
      # reports no match, logs at warning level, and lets the request
      # continue. Reputation is corroborating evidence, not the last line of
      # defence — put addresses you want blocked unconditionally in the
      # IpAddress plugin instead.
      #
      # Private and reserved ranges are never looked up, so a local or
      # intranet deployment spends no quota, and addresses AbuseIPDB marks
      # as whitelisted (search-engine crawlers and the like) never match
      # however high they score.

# Loggers help log data in specific formats. Uses Monolog (https://seldaek.github.io/monolog/)
# Multiple loggers can be added as the following are structured but added as arrays under the logger section.
logger:
  -
    # Full Class Namespace of the logger service.
    class: Monolog\Handler\StreamHandler
    # Arguments that are fed to the logging service
    args:
      # For this service, the location of the logging file.
      - /tmp/data.log
      # The level of debugging to use.
      - Monolog\Level::Debug
    # If the logging service allows for it the Formatting of the data define those details.
    formatter:
      # Class Name of the Formatter to use
      class: Monolog\Formatter\LineFormatter
      # Arguments to pass to the Formatter.
      args:
        # Line formatted
        - "[%datetime%] [%context.plugin%] %message% %context%\n"
        # Date formatter
        - "Y-m-d\\TH:i:sP"

# Conditions
#
# Simple Format
# Supported syntaxes:
#   - "variable:value"                         → defaults to 'equals'
#   - "variable@operator:value"                → uses the given operator
#   - "!variable:value"                        → negated equals
#   - "!variable@operator:value"               → negated with operator
#   - "variable > value" / "variable <= value" → shorthand numeric comparison
#   - (optional) Append "#matches" for array matching behavior:
#       - "#any", "#all", "#none", "#some"
#         e.g., "tags@contains:eco,green#all"
#
# Operators supported include: equals, not_equals, contains, starts_with,
# ends_with, regex, in, greater_than, less_than, greater_than_or_equal,
# less_than_or_equal, etc.
#
# Examples of Simple Format:
# - "foo:bar"               - The variable foo is equal to bar.
# - "foo@starts_with:bar"   - The variable foo starts with bar which means values like barnone and barracuda would be allowed.
# - "foo@in:bar,grill,town" - The variable foo can be either bar, grill, town
# - "!foo:bar"              - The variable foo cannot equal bar.
# - "!foo@starts_with:bar"  - The variable foo cannot start with bar.
#
# Notes:
# - All values are case insensitive
#
# Complex Format
# Written in array formats.
# Each rule should be an associative array with the following keys:
# - variable: string
#     The request field or input to evaluate (e.g., method, host, query param).
# - operator: string
#     Comparison logic, such as:
#       equals, not_equals, contains, starts_with, ends_with, regex, in,
#       greater_than, less_than, greater_than_or_equal, less_than_or_equal
# - value: string|array
#     The value(s) to compare against.
# - negate: bool (optional)
#     Whether to negate the final result. Defaults to false.
# - matches: string (optional)
#     If 'value' is an array, defines how to evaluate:
#       - "any" → pass if at least one match
#       - "all" → pass only if all match
#       - "none" → pass if none match
#       - "some" → pass if some but not all match
# - case_sensitive: bool (optional)
#     Whether the comparison should be case-sensitive. Defaults to false.
#
# Examples
# - Show examples with the above complex format
#
# Grouping Format
# Written in array formats.
# Each rule should be an associative array with the following keys:
#
# - type: string
#      The type of the group (e.g. AND, OR)
# - rules: array
#      An array of mixed with either simple or complex formatted elements
#
# Notes:
#  - Conditions can be mixed between simple and complex
#
#
# When referring to conditions they can be a mixture of Simple Format, Complex Format, or Grouping Format

# =====================================================================
# Legacy format (deprecated)
# =====================================================================
# The firewall still accepts the older top-level `bypass:` and `block:`
# sections; they are auto-normalized into the canonical `plugins:` array
# at load time. The new format above is preferred for all new configs.
#
# Mapping: `bypass:` -> `response: allow`, `block:` -> `response: block`,
# and per-plugin `priority:` -> `weight:`.
#
# Mini example:
#
# bypass:
#   Kanopi\Firewall\Plugins\IpAddress:
#     priority: -200
#     enable: true
#     config:
#       - 1.2.3.4
#
# block:
#   Kanopi\Firewall\Plugins\Url:
#     priority: -10
#     enable: true
#     config:
#       - path:/foo
