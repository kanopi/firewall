services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: ./.docker/php
    depends_on:
      - db
    volumes:
      - .:/var/www/html
      - ./.docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini

  db:
    image: mariadb:10.6
    restart: always
    ports:
      - 0:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: default
      MYSQL_USER: user
      MYSQL_PASSWORD: user

  redis:
    image: redis:6

