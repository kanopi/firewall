services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: ./.docker/php
    depends_on:
      - mariadb
      - postgres
    volumes:
      - .:/var/www/html
      - ./.docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini

  mariadb:
    image: mariadb:10.6
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: firewall_test
      MYSQL_USER: user
      MYSQL_PASSWORD: user

  postgres:
    image: postgres:17.5
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: firewall_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  redis:
    image: redis:6
    ports:
      - 6370:6379
