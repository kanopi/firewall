version: 2.1

orbs:
  ci-tools: kanopi/ci-tools@2

PHP_VERSION: &PHP_VERSION "8.2"
PHP_IMAGE: &PHP_IMAGE "cimg/php:8.2"

jobs:
  build:
    docker:
      - image: *PHP_IMAGE
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - ci-tools/install-github-cli
      - run:
          name: Generate Version File
          command: |
            echo "${CIRCLE_TAG}" > VERSION
      - run:
          name: Build
          command: |
            bash .circleci/scripts/build.sh
      - store_artifacts:
          path: /tmp/firewall.zip
      - run:
          name: Post Artifact
          command: |
            gh -R "github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" release upload ${CIRCLE_TAG} /tmp/firewall.zip --clobber

workflows:
  test:
    jobs:
#      - phpunit:
#          context: kanopi-code
#          filters:
#            tags:
#              ignore: /.*/
#            branches:
#              only: /.*/
      - ci-tools/composer:
          tag: *PHP_VERSION
          name: 'phpstan'
          context: kanopi-code
          command: 'check:security:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpstan-report.xml
            - store_artifacts:
                path: phpstan-report.xml
                destination: phpstan
      - ci-tools/composer:
          tag: *PHP_VERSION
          name: 'rector'
          context: kanopi-code
          command: 'check:rector:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: rector-report.xml
            - store_artifacts:
                path: rector-report.xml
                destination: rector
      - ci-tools/composer:
          tag: *PHP_VERSION
          name: 'quality'
          context: kanopi-code
          command: 'check:code:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpcs-report.xml
            - store_artifacts:
                path: phpcs-report.xml
                destination: phpcs
      - build:
          name: "build"
          context: kanopi-code
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/