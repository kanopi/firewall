version: 2.1

orbs:
  ci-tools: kanopi/ci-tools@2

PHP_VERSION: &PHP_VERSION "8.2"

PHP_VERSION_TEST: &PHP_VERSION_TEST
  - '8.1'
  - '8.2'
  - '8.3'
  - '8.4'
  - '8.5'

jobs:
  build:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        environment:
          - PHP_VERSION=<<parameters.php>>
    resource_class: small
    environment:
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            sudo apt update
            sudo apt install rsync
      - ci-tools/install-github-cli
      - run:
          name: Generate Version File
          command: |
            if [[ "${CIRCLE_TAG}" != "" ]]; then
              echo "${CIRCLE_TAG}" > VERSION
            else
              echo "2.x-dev-${CIRCLE_SHA1:0:7}" > VERSION
            fi
      - run:
          name: Build
          command: |
            bash .circleci/scripts/build.sh
      - store_artifacts:
          path: /tmp/firewall.zip
      - run:
          name: Post Artifact
          command: |
            if [[ "${CIRCLE_TAG}" != "" ]]; then
              cp -R /tmp/firewall.zip "/tmp/firewall-${PHP_VERSION}.zip"
              gh -R "github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" release upload ${CIRCLE_TAG} "/tmp/firewall-${PHP_VERSION}.zip" --clobber
            fi

  phpunit:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        environment:
          # Point the Redis-backed tests at the service below. Set here rather
          # than left to phpunit.env so the rate-limit backend is genuinely
          # exercised: the unit tests for it mock `Redis`, which proves the call
          # sequence and nothing about what Redis does with it. Two real bugs
          # were hiding behind that — a burst inside one second counted as a
          # single request, and a `prefix` option warned on every construction.
          - REDIS_HOST=redis
          - REDIS_PORT=6379
          - TEST_SKIP_REDIS=false
      - image: cimg/mariadb:10.6
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        name: mysql
        environment:
          - MYSQL_ROOT_PASSWORD=password
          - MYSQL_USER=user
          - MYSQL_PASSWORD=user
          - MYSQL_DATABASE=firewall_test
      - image: cimg/postgres:17.5
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        name: postgres
        environment:
          - POSTGRES_DB=firewall_test
          - POSTGRES_USER=postgres
          - POSTGRES_PASSWORD=password
      - image: redis:6
        name: redis
    steps:
      - checkout
      - run:
          name: Install GeoIP DBs
          command: |
            mkdir /tmp/geoip
            bash bin/update_geoip.sh $GEOIP_LICENSE /tmp/geoip/
      - run:
          name: Setup
          command: |
            # Database CLI clients
            sudo apt update
            sudo apt install mariadb-client postgresql-client
            # InterstitialRendererTest parse-checks the generated inline
            # scripts with `node --check`, and fails rather than skips when
            # CI is set. Conditional because the cimg images may already
            # ship node -- installing over an existing one is the only way
            # this could conflict.
            command -v node >/dev/null || sudo apt install -y nodejs
            # Set Hostname
            echo "127.0.0.1 web" | sudo tee -a /etc/hosts
            # Install XDebug
            sudo pecl update-channels
            sudo pecl install xdebug
            printf "no\nno\n" | sudo pecl install redis
            sudo docker-php-ext-install pdo_mysql mysqli pdo_pgsql
            #sudo cp .circleci/config/*.ini /etc/php.d/
            cp .circleci/phpunit.env ./.env
      # Keyed per PHP version: composer.lock is not committed, so each PHP
      # version resolves a different Symfony line (8.1 -> 6.4, 8.2/8.3 -> 7.4,
      # 8.4/8.5 -> 8.1). One shared key would restore a vendor/ built against
      # the wrong line.
      - restore_cache:
          keys:
            - composer-cache-<<parameters.php>>-{{ checksum "composer.json" }}
            - composer-cache-<<parameters.php>>-
      - run:
          name: build assets
          command: |
            composer install --optimize-autoloader
            # Record which Symfony line this run actually exercised.
            composer show symfony/http-foundation | grep -E '^versions'
      - save_cache:
          key: composer-cache-<<parameters.php>>-{{ checksum "composer.json" }}
          paths:
            - vendor
      - run:
          name: Run PHPUnit
          command: composer -n phpunit
      - run:
          name: Check Coverage
          command: |
            # Read and compare with PHP rather than xidel + bc. Both were
            # installed by curl'ing binaries mid-build — one of them a
            # version-pinned .deb over plain HTTP from archive.ubuntu.com,
            # which has already failed a build with "Connection reset by
            # peer". A gate that can fail for reasons unrelated to the code
            # under test is worse than no gate, and PHP is definitionally
            # present in a PHP image.
            # Ratchet, not a target. Sits just under the figure last measured
            # so the gain cannot silently regress, and moves up as coverage
            # does -- it is not a number to write tests against.
            #
            # 90 held from when coverage first included the integration suite
            # until v2.19.2; 97 in v2.20.0. 100 from 2.21.0, where every
            # remaining gap was either tested or annotated with why it cannot
            # be.
            #
            # A floor of 100 is a real constraint, not a vanity number: any new
            # branch has to arrive with a test or an explicit
            # @codeCoverageIgnore saying why it cannot have one. That is the
            # point -- the annotation forces the argument to be written down
            # where a reviewer sees it.
            #
            # Verified at 100.00% for lines and methods with ext-redis present
            # and a Redis server reachable. A developer machine usually has
            # neither, so a local run reports about 95.7% with RedisStorage,
            # RedisRateLimitStorage and RedisConnections uncovered; that is the
            # environment, not a regression. CI installs the extension and runs
            # the service.
            #
            # The figure moves as Redis-backed code is added -- it was ~98.9%
            # when only RedisRateLimitStorage existed, before 2.22.0 added a
            # block list backend and a connection registry. If a local run
            # surprises you, check which files are short before assuming a
            # regression: everything uncovered locally should be Redis.
            #
            # Lines and methods are both compared below. Methods were not, until
            # #270: a new method whose lines happened to be covered by another
            # path slipped through, and the first anyone knew was reading a
            # local per-class table.
            #
            # Classes are deliberately not gated. The report counts 84 of 77 and
            # calls it 109.09% -- anonymous and nested classes inflate the
            # numerator -- so a floor on it would compare against a number that
            # does not mean what it says.
            PASSING=100
            # Read, report and compare entirely inside PHP. Nothing parses
            # PHP's stdout in the shell, because on this image every `php`
            # invocation prints "Module ... is already loaded" warnings to
            # stdout — captured into a variable they prefix the value, and
            # `(float) "Warning: ..."` is 0.0, which failed the gate against
            # a real 95.90%. display_errors=stderr keeps them out of the way
            # as well, but the comparison no longer depends on that.
            php -d display_errors=stderr -r '
              $min = (float) $argv[1];
              $xml = simplexml_load_file("reports/xml/index.xml");
              if ($xml === false) {
                fwrite(STDERR, "Could not read reports/xml/index.xml — did the coverage run produce a report?\n");
                exit(1);
              }
              $totals = $xml->project->directory->totals;
              // The denominator is named differently per metric -- lines carry
              // `executable`, methods carry `count` -- so it is stated rather
              // than guessed. Reading `count` off `lines` returns nothing, which
              // silently dropped the one metric this gate already enforced.
              $metrics = ["lines" => "executable", "methods" => "count"];
              $measured = [];
              foreach ($metrics as $metric => $denominator) {
                $node = $totals->{$metric};
                if ($node === null) {
                  fwrite(STDERR, sprintf("The coverage report has no %s total.\n", $metric));
                  exit(1);
                }
                // Nothing to measure reports 0%, which would fail a 100% floor
                // for no reason: `functions` is 0 of 0 here, and `traits` reports
                // 0.00% for seven traits because their methods are counted
                // against the classes using them. Neither is gated.
                if ((int) $node[$denominator] === 0) {
                  continue;
                }
                $measured[$metric] = (float) $node["percent"];
              }
              if ($measured === []) {
                fwrite(STDERR, "The coverage report contained neither lines nor methods.\n");
                exit(1);
              }
              $summary = [];
              foreach ($measured as $metric => $pct) {
                $summary[] = sprintf("%s: %.2f", ucfirst($metric), $pct);
              }
              $report = sprintf(
                "# PHPUnit Code Coverage\nPHP Version: %s\n%s\nPassing: %.2f\n\n[Report](https://output.circle-artifacts.com/output/job/%s/artifacts/0/reports/index.html)\n",
                $argv[2],
                implode("\n", $summary),
                $min,
                $argv[3]
              );
              echo $report;
              // Every figure is printed whether it passed or not. Reporting only
              // the one that failed, or only on failure, is how a metric drifts
              // for weeks without anyone seeing it move.
              $failed = false;
              foreach ($measured as $metric => $pct) {
                if ($pct < $min) {
                  printf("%s coverage %.2f%% is below the %.2f%% floor.\n", ucfirst($metric), $pct, $min);
                  $failed = true;
                  continue;
                }
                printf("%s coverage %.2f%% meets the %.2f%% floor.\n", ucfirst($metric), $pct, $min);
              }
              if ($failed) {
                exit(1);
              }
            ' "${PASSING}" "<<parameters.php>>" "${CIRCLE_WORKFLOW_JOB_ID}"
      - store_test_results:
          path: reports/junit.xml
      - store_artifacts:
          path: reports

  # Fast correctness check on the performance scenarios — seconds, not minutes,
  # so it runs on every branch and PR.
  #
  # This is not a benchmark. It loads every scenario config through the real
  # Firewall and evaluates a probe request per traffic profile. It exists
  # because `Firewall::create()` does not throw when a config fails to load: it
  # logs the failure and carries on with a partial ruleset. A benchmark over a
  # partial ruleset produces a complete, plausible set of numbers for a firewall
  # that was not running the rules anyone intended. Catching that here costs
  # nothing; catching it by reading a nightly report costs a day.
  #
  # Safe to gate on, unlike the benchmark, because it measures correctness
  # rather than timing and so does not care what hardware it landed on.
  performance-validate:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.json" }}
            - composer-cache-
      - run:
          name: Install dependencies
          command: composer install --no-interaction --optimize-autoloader
      - run:
          name: Validate performance scenario configs
          command: |
            # --skip-geoip: the MaxMind databases are not downloaded for this
            # job. The GeoIP-dependent scenarios are still config-checked by
            # the nightly benchmark, which does have them.
            php tests/Performance/bin/validate-scenarios.php --skip-geoip

  # The performance benchmark. Nightly and on-demand only — see the workflows
  # section for why it is not on every PR.
  #
  # Runs on a `machine` executor rather than `docker`, because the harness is a
  # docker-compose stack (nginx + php-fpm + redis + k6) and a Docker executor
  # cannot bring that up. The previous incarnation of this job tried to
  # `apt-get install php-fpm` and `sudo service nginx start` inside a `cimg/php`
  # container, which cannot work and never ran.
  #
  # This job does not fail on performance numbers. CircleCI runners are shared
  # hardware; an absolute latency gate would flake far more often than it would
  # catch a real regression. It publishes report.md / report.html / summary.json
  # as artifacts and leaves the judgement to a human.
  performance-test:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    # Load generator and target share this box. The harness holds php-fpm at a
    # fixed worker count so runs stay comparable, but k6 still needs headroom
    # of its own — an undersized runner measures the generator, not the target.
    resource_class: large
    environment:
      # Deliberately modest for CI. The point of the nightly run is a
      # comparable trend line across scenarios, not a maximum-throughput
      # number, and a shared runner cannot deliver the latter anyway.
      PERF_VUS: "150"
      PERF_DURATION: "40s"
      PERF_RAMP: "10s"
      PERF_WARMUP: "10"
      PERF_FPM_WORKERS: "48"
      PERF_IP_POOL_SIZE: "5000"
    steps:
      - checkout
      - run:
          name: Run the performance benchmark
          # 14 scenarios, each with a container recreate, a warm-up and a
          # measured run. Well over the 10 minute default no-output timeout.
          no_output_timeout: 45m
          command: bash tests/Performance/bin/run.sh
      - store_artifacts:
          path: tests/Performance/results
          destination: performance
      - run:
          name: Summarise on the job page
          when: always
          command: |
            if [[ -f tests/Performance/results/report.md ]]; then
              cat tests/Performance/results/report.md
            else
              echo "No report was produced — check the benchmark step above."
            fi

  # Build the MkDocs site on every branch and PR. `--strict` promotes every
  # MkDocs warning to a failure, so a broken cross-reference, a missing
  # `--8<--` snippet, or a page absent from `nav:` fails the job rather than
  # shipping quietly. The rendered HTML is stored as an artifact so a reviewer
  # can read a docs change as a real page before approving it.
  docs-build:
    docker:
      - image: cimg/python:3.12
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - docs-pip-{{ checksum "docs/requirements.txt" }}
            - docs-pip-
      - run:
          name: Install docs toolchain
          command: pip install --user -r docs/requirements.txt
      - save_cache:
          key: docs-pip-{{ checksum "docs/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Build docs (strict)
          command: mkdocs build --strict
      - store_artifacts:
          path: site
          destination: docs

  # Publish the reviewed build to the gh-pages branch, which GitHub Pages
  # serves at https://kanopi.github.io/firewall/. Deploys exactly the site/
  # directory docs-build produced and attached to the workspace, rather than
  # rebuilding, so what ships is what CI checked.
  #
  # Runs only on a stable release tag — see the workflow filters below. The
  # published site therefore describes the last release, not the current tip of
  # 2.x.
  #
  # Publishes with `mike`, which keeps one subdirectory per release on gh-pages
  # and maintains the version selector (#198). Before 2.25.0 this called
  # ghp-import directly to push a single unversioned site.
  #
  # That change gives up a property the old job had, deliberately: ghp-import
  # deployed the exact artifact the `docs` job had already built and reviewed,
  # whereas `mike deploy` builds again. mike has no way to publish a prebuilt
  # directory. The rebuild is safe here because this job checks out the *tag*
  # and the toolchain is pinned in docs/requirements.txt, so it builds the same
  # bytes — and `docs` still gates the tag with `--strict` before this runs.
  #
  # Versions are MAJOR.MINOR. A patch release republishes over its own minor
  # rather than adding a directory nobody asked for; `v2.25.1` updates `2.25`.
  # `latest` follows whatever shipped most recently, and the root redirects to
  # it. Old minors stay published forever — they are small, and a 2.x operator
  # reading 3.x documentation is the thing this exists to prevent.
  docs-deploy:
    docker:
      - image: cimg/python:3.12
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - docs-pip-{{ checksum "docs/requirements.txt" }}
            - docs-pip-
      - run:
          name: Install docs toolchain
          command: pip install --user -r docs/requirements.txt
      - run:
          name: Refuse to publish over an unversioned site
          command: |
            git fetch origin gh-pages:gh-pages --depth=1 2>/dev/null || {
              echo "No gh-pages branch yet — mike will create it."
              exit 0
            }
            # Everything mike owns at the root. Anything else is left over from
            # the pre-2.25.0 unversioned deploys, and mike will not remove it:
            # it would keep serving the *old* documentation at its old URLs
            # forever, which is worse than a 404 because it looks correct.
            stale=$(git ls-tree --name-only gh-pages \
              | grep -vE '^([0-9]+\.[0-9]+|latest|index\.html|versions\.json|\.nojekyll|404\.html)$' \
              || true)
            if [[ -n "${stale}" ]]; then
              echo "gh-pages still holds unversioned content at its root:"
              echo "${stale}" | sed 's/^/  /'
              echo
              echo "mike publishes into per-version directories and will not remove these,"
              echo "so they would keep serving pre-2.25.0 documentation at their old URLs."
              echo
              echo "Reset the branch once, then re-run this job:"
              echo "  git push origin --delete gh-pages"
              echo
              echo "gh-pages holds rendered HTML only — nothing is lost, and this job"
              echo "rebuilds it."
              exit 1
            fi
      - run:
          name: Publish this release with mike
          command: |
            TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
            if [[ -z "${TOKEN}" ]]; then
              echo "Neither GITHUB_TOKEN nor GH_TOKEN is set in the CircleCI context."
              echo "Add a token with 'contents: write' on kanopi/firewall to the"
              echo "kanopi-code context, or swap this step for an SSH deploy key."
              exit 1
            fi
            git config user.name "circleci"
            git config user.email "engineering@kanopi.com"
            # Put the credential on the remote rather than on the command line,
            # so a git failure cannot echo the token back into the build log.
            git remote set-url origin \
              "https://x-access-token:${TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            # v2.25.1 -> 2.25. The tag filter below guarantees the shape.
            version="$(echo "${CIRCLE_TAG}" | sed -E 's/^v([0-9]+\.[0-9]+)\..*$/\1/')"
            if [[ -z "${version}" || "${version}" == "${CIRCLE_TAG}" ]]; then
              echo "Could not derive a MAJOR.MINOR version from tag '${CIRCLE_TAG}'."
              exit 1
            fi
            echo "Publishing ${CIRCLE_TAG} as ${version}, aliased latest."
            # --update-aliases moves `latest` off whatever held it before.
            # `[ci skip]` keeps the gh-pages commit from triggering a build.
            mike deploy \
              --push \
              --update-aliases \
              --branch gh-pages \
              --message "docs: deploy ${CIRCLE_TAG} as ${version} [ci skip]" \
              "${version}" latest
            # Writes the root index.html that redirects to the default. Without
            # it, the site root is a directory listing or a 404.
            mike set-default --push --branch gh-pages latest

workflows:
  test:
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: phpstan <<matrix.tag>>
          context: kanopi-code
          command: 'check:security:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpstan-report.xml
            - store_artifacts:
                path: phpstan-report.xml
                destination: phpstan
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'rector <<matrix.tag>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: rector-report.xml
            - store_artifacts:
                path: rector-report.xml
                destination: rector
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'quality <<matrix.tag>>'
          context: kanopi-code
          command: 'check:code:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpcs-report.xml
            - store_artifacts:
                path: phpcs-report.xml
                destination: phpcs
      - build:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: "build <<matrix.php>>"
          context: kanopi-code
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      # Runs on every branch and PR as the strict-validation gate, and also on
      # tags — not for its own sake, but because `docs deploy` requires it. A
      # required job that filters tags out is absent from the tagged workflow,
      # which would leave the deploy waiting on a job that never runs.
      - docs-build:
          name: docs
          context: kanopi-code
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      # Publishing is tied to a release tag, not to a merge. `2.x` accumulates
      # commits between releases, so deploying from it meant the site described
      # unreleased behaviour — someone reading it had no way to tell which parts
      # matched the version they had installed.
      #
      # Stable tags only: `v2.9.0` publishes, `v2.9.0-beta1` does not, so a
      # prerelease cannot overwrite the docs for the current stable release.
      - docs-deploy:
          name: docs deploy
          context: kanopi-code
          requires:
            - docs
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      # Cheap enough for every PR, and the thing most likely to actually break:
      # a scenario config that stops loading after a plugin's options change.
      - performance-validate:
          name: "performance scenarios"
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/

  # The benchmark runs nightly rather than per-PR, for two reasons:
  #
  #   1. It takes 20-40 minutes on a `large` machine executor. Paying that on
  #      every push would dominate the credit spend for this repository.
  #   2. Performance numbers from shared CI hardware are not comparable between
  #      jobs, so they could not gate a merge even if they were free. Trend data
  #      from a consistent nightly slot is worth something; a noisy number
  #      attached to a diff is worth less than nothing, because people learn to
  #      ignore it.
  #
  # To benchmark a specific branch before merging, trigger this workflow from
  # the CircleCI UI, or run `bash tests/Performance/bin/run.sh` locally — the
  # harness is identical either way.
  nightly-performance:
    triggers:
      - schedule:
          # 07:00 UTC: outside working hours for both US and EU, so a 40 minute
          # job is not competing for runners with the team's own pushes.
          cron: "0 7 * * *"
          filters:
            branches:
              only:
                - 2.x
    jobs:
      - performance-test:
          name: "performance"
          context: kanopi-code
