version: 2.1

orbs:
  ci-tools: kanopi/ci-tools@2

PHP_VERSION: &PHP_VERSION "8.2"

PHP_VERSION_TEST: &PHP_VERSION_TEST
  - '8.1'
  - '8.2'
  - '8.3'
  - '8.4'
  - '8.5'

jobs:
  build:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        environment:
          - PHP_VERSION=<<parameters.php>>
    resource_class: small
    environment:
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            sudo apt update
            sudo apt install rsync
      - ci-tools/install-github-cli
      - run:
          name: Generate Version File
          command: |
            if [[ "${CIRCLE_TAG}" != "" ]]; then
              echo "${CIRCLE_TAG}" > VERSION
            else
              echo "2.x-dev-${CIRCLE_SHA1:0:7}" > VERSION
            fi
      - run:
          name: Build
          command: |
            bash .circleci/scripts/build.sh
      - store_artifacts:
          path: /tmp/firewall.zip
      - run:
          name: Post Artifact
          command: |
            if [[ "${CIRCLE_TAG}" != "" ]]; then
              cp -R /tmp/firewall.zip "/tmp/firewall-${PHP_VERSION}.zip"
              gh -R "github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" release upload ${CIRCLE_TAG} "/tmp/firewall-${PHP_VERSION}.zip" --clobber
            fi

  phpunit:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
      - image: cimg/mariadb:10.6
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        name: mysql
        environment:
          - MYSQL_ROOT_PASSWORD=password
          - MYSQL_USER=user
          - MYSQL_PASSWORD=user
          - MYSQL_DATABASE=firewall_test
      - image: cimg/postgres:17.5
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        name: postgres
        environment:
          - POSTGRES_DB=firewall_test
          - POSTGRES_USER=postgres
          - POSTGRES_PASSWORD=password
      - image: redis:6
        name: redis
    steps:
      - checkout
      - ci-tools/install-github-cli
      - run:
          name: Install GeoIP DBs
          command: |
            mkdir /tmp/geoip
            bash bin/update_geoip.sh $GEOIP_LICENSE /tmp/geoip/
      - run:
          name: Setup
          command: |
            # Install BC Tool
            sudo apt update
            sudo apt install mariadb-client postgresql-client
            curl -o /tmp/bc.deb -fsSL http://archive.ubuntu.com/ubuntu/pool/main/b/bc/bc_1.07.1-3build1_amd64.deb
            sudo dpkg -i /tmp/bc.deb 
            # Set Hostname
            echo "127.0.0.1 web" | sudo tee -a /etc/hosts
            # Install XDebug
            sudo pecl update-channels
            sudo pecl install xdebug
            printf "no\nno\n" | sudo pecl install redis
            sudo docker-php-ext-install pdo_mysql mysqli pdo_pgsql
            #sudo cp .circleci/config/*.ini /etc/php.d/
            # Install Xidel
            curl -fsSL https://github.com/benibela/xidel/releases/download/Xidel_0.9.8/xidel-0.9.8.linux64.tar.gz | tar xvz -C /tmp/
            chmod +x /tmp/xidel && sudo mv /tmp/xidel /usr/sbin/
            cp .circleci/phpunit.env ./.env
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.json" }}
            - composer-cache-
      - run:
          name: build assets
          command: composer install --optimize-autoloader
      - save_cache:
          key: composer-cache-{{ checksum "composer.json" }}
          paths:
            - vendor
      - run:
          name: Run PHPUnit
          command: composer -n phpunit
      - run:
          name: Check Overage
          command: |
            PERCENTAGE=$(xidel -s --xpath "string(//phpunit/project/directory/totals/lines/@percent)" reports/xml/index.xml)
            PASSING=85
            OUTCOME=$(echo "${PERCENTAGE} < ${PASSING}" | bc)
            echo "# PHPUnit Code Coverage" | tee -a /tmp/report.md
            echo "PHP Version: <<parameters.php>>" | tee -a /tmp/report.md
            echo "Percent: ${PERCENTAGE}" | tee -a /tmp/report.md
            echo "Passing: ${PASSING}" | tee -a /tmp/report.md
            echo "" | tee -a /tmp/report.md
            echo "[Report](https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/0/reports/index.html)" | tee -a /tmp/report.md
#            if [[ "${OUTCOME}" == "1" ]]; then
#              echo "Percentage does not pass threshold."
#              exit 1
#            fi
      - ci-tools/post-to-github-commit:
          body: '@/tmp/report.md'
          when: always
      - run:
          name: "Comment on PR"
          when: always
          command: |
            if [[ "${CI_PULL_REQUEST}" != "" ]]; then
              gh pr comment --body-file /tmp/report.md
            fi
      - store_test_results:
          path: reports/junit.xml
      - store_artifacts:
          path: reports

  performance-test:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
      - image: redis:7
        name: redis
      - image: cimg/mariadb:10.6
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        name: db
        environment:
          - MYSQL_ROOT_PASSWORD=root
          - MYSQL_USER=firewall
          - MYSQL_PASSWORD=firewall_pass
          - MYSQL_DATABASE=firewall_test
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Install system packages
          command: |
            sudo apt-get update
            sudo apt-get install -y nginx apache2-utils htop sysstat
            sudo rm -f /etc/nginx/sites-enabled/default
      - run:
          name: Configure nginx
          command: |
            sudo tee /etc/nginx/sites-available/firewall-test << 'EOF'
            server {
                listen 8080;
                server_name localhost;
                root /home/circleci/project;
                
                location / {
                    try_files $uri /tests/Performance/test-app.php$is_args$args;
                }
                
                location ~ \.php$ {
                    fastcgi_pass 127.0.0.1:9000;
                    fastcgi_index index.php;
                    include fastcgi_params;
                    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                    fastcgi_buffer_size 128k;
                    fastcgi_buffers 256 16k;
                    fastcgi_busy_buffers_size 256k;
                }
            }
            EOF
            sudo ln -sf /etc/nginx/sites-available/firewall-test /etc/nginx/sites-enabled/
      - run:
          name: Start PHP-FPM
          command: |
            sudo mkdir -p /run/php
            sudo php-fpm -D -c /etc/php/${PHP_VERSION}/cli/php.ini -y /dev/stdin <<EOF
            [www]
            user = circleci
            group = circleci
            listen = 127.0.0.1:9000
            pm = dynamic
            pm.max_children = 50
            pm.start_servers = 10
            pm.min_spare_servers = 5
            pm.max_spare_servers = 20
            EOF
      - run:
          name: Start nginx
          command: sudo nginx
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.lock" }}
            - composer-cache-
      - run:
          name: Install dependencies
          command: |
            composer install --optimize-autoloader
            composer require guzzlehttp/guzzle symfony/yaml
      - save_cache:
          key: composer-cache-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - run:
          name: Download GeoIP databases
          command: |
            mkdir -p /tmp/geoip
            if [[ -n "${MAXMIND_LICENSE_KEY}" ]]; then
              echo "Downloading latest GeoIP databases..."
              bash bin/update_geoip.sh "${MAXMIND_LICENSE_KEY}" /tmp/geoip
            else
              echo "No MaxMind license key found, copying from example directory..."
              cp example/GeoLite2-*.mmdb /tmp/geoip/ || true
            fi
            export GEOIP_DB_PATH=/tmp/geoip/GeoLite2-City.mmdb
            export ASN_DB_PATH=/tmp/geoip/GeoLite2-ASN.mmdb
      - run:
          name: Wait for services
          command: |
            dockerize -wait tcp://localhost:3306 -timeout 1m
            dockerize -wait tcp://localhost:6379 -timeout 1m
            dockerize -wait tcp://localhost:8080 -timeout 1m
      - run:
          name: Run performance benchmark
          command: |
            export FIREWALL_TEST=1
            export FIREWALL_TEST_URL=http://localhost:8080
            export DB_HOST=127.0.0.1
            export DB_USER=firewall
            export DB_PASS=firewall_pass
            export DB_NAME=firewall_test
            export REDIS_HOST=127.0.0.1
            export REDIS_PORT=6379
            export GEOIP_DB_PATH=/tmp/geoip/GeoLite2-City.mmdb
            export ASN_DB_PATH=/tmp/geoip/GeoLite2-ASN.mmdb
            export GEOIP_COUNTRY_DB_PATH=/tmp/geoip/GeoLite2-Country.mmdb
            mkdir -p reports/performance
            php tests/Performance/run-benchmark.php --config=tests/Performance/benchmark-config.yml
      - run:
          name: Check performance criteria
          command: |
            php tests/Performance/check-criteria.php reports/performance/results.json
      - store_artifacts:
          path: reports/performance
          destination: performance-reports
      - store_test_results:
          path: reports/performance

  # Build the MkDocs site on every branch and PR. `--strict` promotes every
  # MkDocs warning to a failure, so a broken cross-reference, a missing
  # `--8<--` snippet, or a page absent from `nav:` fails the job rather than
  # shipping quietly. The rendered HTML is stored as an artifact so a reviewer
  # can read a docs change as a real page before approving it.
  docs-build:
    docker:
      - image: cimg/python:3.12
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - ci-tools/install-github-cli
      - restore_cache:
          keys:
            - docs-pip-{{ checksum "docs/requirements.txt" }}
            - docs-pip-
      - run:
          name: Install docs toolchain
          command: pip install --user -r docs/requirements.txt
      - save_cache:
          key: docs-pip-{{ checksum "docs/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Build docs (strict)
          command: mkdocs build --strict
      - store_artifacts:
          path: site
          destination: docs
      - persist_to_workspace:
          root: .
          paths:
            - site
      - run:
          name: Comment preview link on PR
          when: on_success
          command: |
            if [[ "${CI_PULL_REQUEST}" == "" ]]; then
              echo "Not a PR — skipping preview comment."
              exit 0
            fi
            PREVIEW="https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/0/docs/index.html"
            echo "📖 **Docs preview** for this PR: [${PREVIEW}](${PREVIEW})" > /tmp/docs-preview.md
            gh pr comment --body-file /tmp/docs-preview.md

  # Publish the reviewed build to the gh-pages branch, which GitHub Pages
  # serves at https://kanopi.github.io/firewall/. Deploys exactly the artifact
  # docs-build produced (`--no-build`) rather than rebuilding, so what ships is
  # what CI checked.
  #
  # Runs only on a stable release tag — see the workflow filters below. The
  # published site therefore describes the last release, not the current tip of
  # 2.x.
  #
  # `mkdocs gh-deploy` hands the built site/ directory to ghp-import, which
  # commits it to the gh-pages branch and pushes. That branch holds rendered
  # HTML only, no source, and is created on the first successful deploy — there
  # is nothing to set up beforehand beyond pointing Pages at it.
  docs-deploy:
    docker:
      - image: cimg/python:3.12
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - docs-pip-{{ checksum "docs/requirements.txt" }}
            - docs-pip-
      - run:
          name: Install docs toolchain
          command: pip install --user -r docs/requirements.txt
      - run:
          name: Publish to gh-pages
          command: |
            TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
            if [[ -z "${TOKEN}" ]]; then
              echo "Neither GITHUB_TOKEN nor GH_TOKEN is set in the CircleCI context."
              echo "Add a token with 'contents: write' on kanopi/firewall to the"
              echo "kanopi-code context, or swap this step for an SSH deploy key."
              exit 1
            fi
            git config user.name "circleci"
            git config user.email "engineering@kanopi.com"
            # Put the credential on the remote rather than on the command line,
            # so a git failure cannot echo the token back into the build log.
            git remote set-url origin \
              "https://x-access-token:${TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            # `[ci skip]` keeps the gh-pages commit from triggering a build of
            # its own. The tag goes in the message so gh-pages history reads as
            # a list of releases rather than of SHAs.
            mkdocs gh-deploy \
              --no-build \
              --force \
              --remote-name origin \
              --message "docs: deploy ${CIRCLE_TAG:-${CIRCLE_SHA1:0:7}} [ci skip]"

workflows:
  test:
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: phpstan <<matrix.tag>>
          context: kanopi-code
          command: 'check:security:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpstan-report.xml
            - store_artifacts:
                path: phpstan-report.xml
                destination: phpstan
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'rector <<matrix.tag>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: rector-report.xml
            - store_artifacts:
                path: rector-report.xml
                destination: rector
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'quality <<matrix.tag>>'
          context: kanopi-code
          command: 'check:code:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpcs-report.xml
            - store_artifacts:
                path: phpcs-report.xml
                destination: phpcs
      - build:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: "build <<matrix.php>>"
          context: kanopi-code
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      # Runs on every branch and PR as the strict-validation gate, and also on
      # tags — not for its own sake, but because `docs deploy` requires it. A
      # required job that filters tags out is absent from the tagged workflow,
      # which would leave the deploy waiting on a job that never runs.
      - docs-build:
          name: docs
          context: kanopi-code
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      # Publishing is tied to a release tag, not to a merge. `2.x` accumulates
      # commits between releases, so deploying from it meant the site described
      # unreleased behaviour — someone reading it had no way to tell which parts
      # matched the version they had installed.
      #
      # Stable tags only: `v2.9.0` publishes, `v2.9.0-beta1` does not, so a
      # prerelease cannot overwrite the docs for the current stable release.
      - docs-deploy:
          name: docs deploy
          context: kanopi-code
          requires:
            - docs
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
