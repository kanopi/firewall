version: 2.1

orbs:
  ci-tools: kanopi/ci-tools@2

PHP_VERSION: &PHP_VERSION "8.2"

PHP_VERSION_TEST: &PHP_VERSION_TEST
  - '8.1'
  - '8.2'
  - '8.3'
  - '8.4'
  - '8.5'

jobs:
  build:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        environment:
          - PHP_VERSION=<<parameters.php>>
    resource_class: small
    environment:
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            sudo apt update
            sudo apt install rsync
      - ci-tools/install-github-cli
      - run:
          name: Generate Version File
          command: |
            if [[ "${CIRCLE_TAG}" != "" ]]; then
              echo "${CIRCLE_TAG}" > VERSION
            else
              echo "2.x-dev-${CIRCLE_SHA1:0:7}" > VERSION
            fi
      - run:
          name: Build
          command: |
            bash .circleci/scripts/build.sh
      - store_artifacts:
          path: /tmp/firewall.zip
      - run:
          name: Post Artifact
          command: |
            if [[ "${CIRCLE_TAG}" != "" ]]; then
              cp -R /tmp/firewall.zip "/tmp/firewall-${PHP_VERSION}.zip"
              gh -R "github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" release upload ${CIRCLE_TAG} "/tmp/firewall-${PHP_VERSION}.zip" --clobber
            fi

  phpunit:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
      - image: cimg/mariadb:10.6
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        name: mysql
        environment:
          - MYSQL_ROOT_PASSWORD=password
          - MYSQL_USER=user
          - MYSQL_PASSWORD=user
          - MYSQL_DATABASE=firewall_test
      - image: cimg/postgres:17.5
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        name: postgres
        environment:
          - POSTGRES_DB=firewall_test
          - POSTGRES_USER=postgres
          - POSTGRES_PASSWORD=password
      - image: redis:6
        name: redis
    steps:
      - checkout
      - ci-tools/install-github-cli
      - run:
          name: Install GeoIP DBs
          command: |
            mkdir /tmp/geoip
            bash bin/update_geoip.sh $GEOIP_LICENSE /tmp/geoip/
      - run:
          name: Setup
          command: |
            # Install BC Tool
            sudo apt update
            sudo apt install mariadb-client postgresql-client
            curl -o /tmp/bc.deb -fsSL http://archive.ubuntu.com/ubuntu/pool/main/b/bc/bc_1.07.1-3build1_amd64.deb
            sudo dpkg -i /tmp/bc.deb 
            # Set Hostname
            echo "127.0.0.1 web" | sudo tee -a /etc/hosts
            # Install XDebug
            sudo pecl update-channels
            sudo pecl install xdebug
            printf "no\nno\n" | sudo pecl install redis
            sudo docker-php-ext-install pdo_mysql mysqli pdo_pgsql
            #sudo cp .circleci/config/*.ini /etc/php.d/
            # Install Xidel
            curl -fsSL https://github.com/benibela/xidel/releases/download/Xidel_0.9.8/xidel-0.9.8.linux64.tar.gz | tar xvz -C /tmp/
            chmod +x /tmp/xidel && sudo mv /tmp/xidel /usr/sbin/
            cp .circleci/phpunit.env ./.env
      # Keyed per PHP version: composer.lock is not committed, so each PHP
      # version resolves a different Symfony line (8.1 -> 6.4, 8.2/8.3 -> 7.4,
      # 8.4/8.5 -> 8.1). One shared key would restore a vendor/ built against
      # the wrong line.
      - restore_cache:
          keys:
            - composer-cache-<<parameters.php>>-{{ checksum "composer.json" }}
            - composer-cache-<<parameters.php>>-
      - run:
          name: build assets
          command: |
            composer install --optimize-autoloader
            # Record which Symfony line this run actually exercised.
            composer show symfony/http-foundation | grep -E '^versions'
      - save_cache:
          key: composer-cache-<<parameters.php>>-{{ checksum "composer.json" }}
          paths:
            - vendor
      - run:
          name: Run PHPUnit
          command: composer -n phpunit
      - run:
          name: Check Overage
          command: |
            PERCENTAGE=$(xidel -s --xpath "string(//phpunit/project/directory/totals/lines/@percent)" reports/xml/index.xml)
            PASSING=85
            OUTCOME=$(echo "${PERCENTAGE} < ${PASSING}" | bc)
            echo "# PHPUnit Code Coverage" | tee -a /tmp/report.md
            echo "PHP Version: <<parameters.php>>" | tee -a /tmp/report.md
            echo "Percent: ${PERCENTAGE}" | tee -a /tmp/report.md
            echo "Passing: ${PASSING}" | tee -a /tmp/report.md
            echo "" | tee -a /tmp/report.md
            echo "[Report](https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/0/reports/index.html)" | tee -a /tmp/report.md
#            if [[ "${OUTCOME}" == "1" ]]; then
#              echo "Percentage does not pass threshold."
#              exit 1
#            fi
      - ci-tools/post-to-github-commit:
          body: '@/tmp/report.md'
          when: always
      - run:
          name: "Comment on PR"
          when: always
          command: |
            if [[ "${CI_PULL_REQUEST}" != "" ]]; then
              gh pr comment --body-file /tmp/report.md
            fi
      - store_test_results:
          path: reports/junit.xml
      - store_artifacts:
          path: reports

  # Fast correctness check on the performance scenarios — seconds, not minutes,
  # so it runs on every branch and PR.
  #
  # This is not a benchmark. It loads every scenario config through the real
  # Firewall and evaluates a probe request per traffic profile. It exists
  # because `Firewall::create()` does not throw when a config fails to load: it
  # logs the failure and carries on with a partial ruleset. A benchmark over a
  # partial ruleset produces a complete, plausible set of numbers for a firewall
  # that was not running the rules anyone intended. Catching that here costs
  # nothing; catching it by reading a nightly report costs a day.
  #
  # Safe to gate on, unlike the benchmark, because it measures correctness
  # rather than timing and so does not care what hardware it landed on.
  performance-validate:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.json" }}
            - composer-cache-
      - run:
          name: Install dependencies
          command: composer install --no-interaction --optimize-autoloader
      - run:
          name: Validate performance scenario configs
          command: |
            # --skip-geoip: the MaxMind databases are not downloaded for this
            # job. The GeoIP-dependent scenarios are still config-checked by
            # the nightly benchmark, which does have them.
            php tests/Performance/bin/validate-scenarios.php --skip-geoip

  # The performance benchmark. Nightly and on-demand only — see the workflows
  # section for why it is not on every PR.
  #
  # Runs on a `machine` executor rather than `docker`, because the harness is a
  # docker-compose stack (nginx + php-fpm + redis + k6) and a Docker executor
  # cannot bring that up. The previous incarnation of this job tried to
  # `apt-get install php-fpm` and `sudo service nginx start` inside a `cimg/php`
  # container, which cannot work and never ran.
  #
  # This job does not fail on performance numbers. CircleCI runners are shared
  # hardware; an absolute latency gate would flake far more often than it would
  # catch a real regression. It publishes report.md / report.html / summary.json
  # as artifacts and leaves the judgement to a human.
  performance-test:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    # Load generator and target share this box. The harness holds php-fpm at a
    # fixed worker count so runs stay comparable, but k6 still needs headroom
    # of its own — an undersized runner measures the generator, not the target.
    resource_class: large
    environment:
      # Deliberately modest for CI. The point of the nightly run is a
      # comparable trend line across scenarios, not a maximum-throughput
      # number, and a shared runner cannot deliver the latter anyway.
      PERF_VUS: "150"
      PERF_DURATION: "40s"
      PERF_RAMP: "10s"
      PERF_WARMUP: "10"
      PERF_FPM_WORKERS: "48"
      PERF_IP_POOL_SIZE: "5000"
    steps:
      - checkout
      - run:
          name: Run the performance benchmark
          # 14 scenarios, each with a container recreate, a warm-up and a
          # measured run. Well over the 10 minute default no-output timeout.
          no_output_timeout: 45m
          command: bash tests/Performance/bin/run.sh
      - store_artifacts:
          path: tests/Performance/results
          destination: performance
      - run:
          name: Summarise on the job page
          when: always
          command: |
            if [[ -f tests/Performance/results/report.md ]]; then
              cat tests/Performance/results/report.md
            else
              echo "No report was produced — check the benchmark step above."
            fi

  # Build the MkDocs site on every branch and PR. `--strict` promotes every
  # MkDocs warning to a failure, so a broken cross-reference, a missing
  # `--8<--` snippet, or a page absent from `nav:` fails the job rather than
  # shipping quietly. The rendered HTML is stored as an artifact so a reviewer
  # can read a docs change as a real page before approving it.
  docs-build:
    docker:
      - image: cimg/python:3.12
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - ci-tools/install-github-cli
      - restore_cache:
          keys:
            - docs-pip-{{ checksum "docs/requirements.txt" }}
            - docs-pip-
      - run:
          name: Install docs toolchain
          command: pip install --user -r docs/requirements.txt
      - save_cache:
          key: docs-pip-{{ checksum "docs/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Build docs (strict)
          command: mkdocs build --strict
      - store_artifacts:
          path: site
          destination: docs
      - persist_to_workspace:
          root: .
          paths:
            - site
      - run:
          name: Comment preview link on PR
          when: on_success
          command: |
            if [[ "${CI_PULL_REQUEST}" == "" ]]; then
              echo "Not a PR — skipping preview comment."
              exit 0
            fi
            PREVIEW="https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/0/docs/index.html"
            echo "📖 **Docs preview** for this PR: [${PREVIEW}](${PREVIEW})" > /tmp/docs-preview.md
            gh pr comment --body-file /tmp/docs-preview.md

  # Publish the reviewed build to the gh-pages branch, which GitHub Pages
  # serves at https://kanopi.github.io/firewall/. Deploys exactly the site/
  # directory docs-build produced and attached to the workspace, rather than
  # rebuilding, so what ships is what CI checked.
  #
  # Runs only on a stable release tag — see the workflow filters below. The
  # published site therefore describes the last release, not the current tip of
  # 2.x.
  #
  # Calls ghp-import directly rather than going through `mkdocs gh-deploy`.
  # gh-deploy always builds first — it has no flag to skip that — so it would
  # discard the reviewed artifact and rebuild from source in this job. ghp-import
  # is the tool gh-deploy wraps, invoked with the same arguments it passes
  # (including --no-jekyll, without which Pages' Jekyll pass drops files whose
  # names begin with an underscore).
  #
  # ghp-import commits the directory to the gh-pages branch and pushes. That
  # branch holds rendered HTML only, no source, and is created on the first
  # successful deploy — there is nothing to set up beforehand beyond pointing
  # Pages at it.
  docs-deploy:
    docker:
      - image: cimg/python:3.12
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - docs-pip-{{ checksum "docs/requirements.txt" }}
            - docs-pip-
      - run:
          name: Install docs toolchain
          command: pip install --user -r docs/requirements.txt
      - run:
          name: Publish to gh-pages
          command: |
            TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
            if [[ -z "${TOKEN}" ]]; then
              echo "Neither GITHUB_TOKEN nor GH_TOKEN is set in the CircleCI context."
              echo "Add a token with 'contents: write' on kanopi/firewall to the"
              echo "kanopi-code context, or swap this step for an SSH deploy key."
              exit 1
            fi
            git config user.name "circleci"
            git config user.email "engineering@kanopi.com"
            # Put the credential on the remote rather than on the command line,
            # so a git failure cannot echo the token back into the build log.
            git remote set-url origin \
              "https://x-access-token:${TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            # Deploying an empty or missing site/ would replace the live docs
            # with nothing, so fail loudly instead.
            if [[ ! -f site/index.html ]]; then
              echo "site/index.html is missing — the docs-build workspace did not attach."
              echo "Nothing was deployed; gh-pages still holds the previous release."
              exit 1
            fi
            # `[ci skip]` keeps the gh-pages commit from triggering a build of
            # its own. The tag goes in the message so gh-pages history reads as
            # a list of releases rather than of SHAs.
            ghp-import \
              --no-jekyll \
              --push \
              --force \
              --branch gh-pages \
              --remote origin \
              --message "docs: deploy ${CIRCLE_TAG:-${CIRCLE_SHA1:0:7}} [ci skip]" \
              site

workflows:
  test:
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: phpstan <<matrix.tag>>
          context: kanopi-code
          command: 'check:security:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpstan-report.xml
            - store_artifacts:
                path: phpstan-report.xml
                destination: phpstan
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'rector <<matrix.tag>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: rector-report.xml
            - store_artifacts:
                path: rector-report.xml
                destination: rector
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'quality <<matrix.tag>>'
          context: kanopi-code
          command: 'check:code:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpcs-report.xml
            - store_artifacts:
                path: phpcs-report.xml
                destination: phpcs
      - build:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: "build <<matrix.php>>"
          context: kanopi-code
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      # Runs on every branch and PR as the strict-validation gate, and also on
      # tags — not for its own sake, but because `docs deploy` requires it. A
      # required job that filters tags out is absent from the tagged workflow,
      # which would leave the deploy waiting on a job that never runs.
      - docs-build:
          name: docs
          context: kanopi-code
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      # Publishing is tied to a release tag, not to a merge. `2.x` accumulates
      # commits between releases, so deploying from it meant the site described
      # unreleased behaviour — someone reading it had no way to tell which parts
      # matched the version they had installed.
      #
      # Stable tags only: `v2.9.0` publishes, `v2.9.0-beta1` does not, so a
      # prerelease cannot overwrite the docs for the current stable release.
      - docs-deploy:
          name: docs deploy
          context: kanopi-code
          requires:
            - docs
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      # Cheap enough for every PR, and the thing most likely to actually break:
      # a scenario config that stops loading after a plugin's options change.
      - performance-validate:
          name: "performance scenarios"
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/

  # The benchmark runs nightly rather than per-PR, for two reasons:
  #
  #   1. It takes 20-40 minutes on a `large` machine executor. Paying that on
  #      every push would dominate the credit spend for this repository.
  #   2. Performance numbers from shared CI hardware are not comparable between
  #      jobs, so they could not gate a merge even if they were free. Trend data
  #      from a consistent nightly slot is worth something; a noisy number
  #      attached to a diff is worth less than nothing, because people learn to
  #      ignore it.
  #
  # To benchmark a specific branch before merging, trigger this workflow from
  # the CircleCI UI, or run `bash tests/Performance/bin/run.sh` locally — the
  # harness is identical either way.
  nightly-performance:
    triggers:
      - schedule:
          # 07:00 UTC: outside working hours for both US and EU, so a 40 minute
          # job is not competing for runners with the team's own pushes.
          cron: "0 7 * * *"
          filters:
            branches:
              only:
                - 2.x
    jobs:
      - performance-test:
          name: "performance"
          context: kanopi-code
